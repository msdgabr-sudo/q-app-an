name: Deploy app.qiblalabs.com

on:
  push:
    branches:
      - main
      - release/aab-3.1.0
    paths:
      - 'source/**'
      - '.github/workflows/deploy-app-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release snapshot
        uses: actions/checkout@v4

      - name: Verify standalone web release
        shell: bash
        run: |
          set -euo pipefail
          test -f source/index.html
          test -f source/manifest.json
          test -f source/service-worker.js
          test -f source/CNAME
          test -f source/.nojekyll
          test -f source/.well-known/assetlinks.json
          test "$(tr -d '\r\n' < source/CNAME)" = "app.qiblalabs.com"
          test "$(tr -d '\r\n' < source/.release-source-sha)" = "6e49775df5742413371a4165ea985173c43f5f5e"
          ! grep -RIlE --exclude-dir='.git' 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|service_account|private_key_id' source >/dev/null
          if find source -type f \( -iname '*.jks' -o -iname '*.keystore' -o -iname '*.p12' -o -iname '*.pfx' -o -iname '*.pem' \) -print -quit | grep -q .; then
            echo 'ERROR: signing/private key material found in web release.' >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
