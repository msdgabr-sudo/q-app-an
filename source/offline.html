<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05080F">
<title>QiblaAstro — Offline</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#05080F;
    color:#D8D0BC;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    direction:rtl;
  }
  .logo{
    width:120px;height:120px;
    margin-bottom:24px;
    border-radius:28px;
    background:linear-gradient(135deg,#1A1008,#0D0A04);
    border:2px solid rgba(200,164,74,.3);
    display:flex;align-items:center;justify-content:center;
    font-size:3rem;
    box-shadow:0 0 40px rgba(200,164,74,.15);
  }
  h1{
    font-size:1.6rem;
    color:#C8A44A;
    margin-bottom:8px;
    letter-spacing:.04em;
  }
  p{
    font-size:.9rem;
    color:#8AAEF0;
    line-height:1.8;
    max-width:320px;
    margin-bottom:24px;
  }
  .status{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 20px;
    background:rgba(200,164,74,.08);
    border:1px solid rgba(200,164,74,.2);
    border-radius:12px;
    font-size:.85rem;
    color:#E8C060;
    margin-bottom:20px;
  }
  .status::before{
    content:'';
    width:8px;height:8px;
    border-radius:50%;
    background:#E8C060;
    animation:pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.4;transform:scale(.7)}
  }
  button{
    padding:14px 32px;
    border-radius:14px;
    border:2px solid #C8A44A;
    background:linear-gradient(135deg,#7A5010,#C8A44A);
    color:#000;
    font-family:inherit;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 0 24px rgba(200,164,74,.3);
    transition:transform .2s,box-shadow .2s;
  }
  button:hover,button:active{
    transform:translateY(-2px);
    box-shadow:0 4px 28px rgba(200,164,74,.4);
  }
  .features{
    margin-top:32px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    max-width:400px;
  }
  .feature{
    padding:8px 14px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.06);
    border-radius:10px;
    font-size:.72rem;
    color:#5A7090;
  }
</style>
</head>
<body>
  <div class="logo">🕌</div>
  <h1>QiblaAstro</h1>
  <div class="status">جاري محاولة الاتصال...</div>
  <p>
    يبدو أنك غير متصل بالإنترنت حالياً.<br>
    بعض الميزات قد لا تعمل بدون اتصال، لكن البوصلة الفلكية ومواقيت الصلاة تعملان دون إنترنت.
  </p>
  <button onclick="window.location.reload()">🔄 إعادة المحاولة</button>
  <div class="features">
    <span class="feature">🧭 البوصلة تعمل بدون إنترنت</span>
    <span class="feature">🕌 مواقيت الصلاة محسوبة محلياً</span>
    <span class="feature">🌙 التحديد الليلي متاح</span>
    <span class="feature">📿 الأذكار متوفرة</span>
    <span class="feature">📖 القرآن محفوظ محلياً</span>
  </div>
  <script>
    // Auto-retry when online
    window.addEventListener('online', function(){
      window.location.reload();
    });
    // Update status text
    if(navigator.onLine){
      document.querySelector('.status').textContent = 'جاري التحميل...';
    }
  </script>
</body>
</html>
