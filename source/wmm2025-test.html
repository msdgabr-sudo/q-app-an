<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QiblaAstro WMM2025 Gate</title><style>body{font-family:system-ui;margin:24px;background:#111;color:#eee}main{max-width:850px;margin:auto}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:10px;border-bottom:1px solid #444;text-align:center}.ok{color:#6fda86}.bad{color:#ff7676}.box{padding:16px;border:1px solid #555;border-radius:12px;margin:14px 0}input{width:110px;padding:8px;margin:4px}button{padding:9px 16px}</style><main><h1>بوابة اختبار WMM2025 المستقلة</h1><p>هذه الصفحة لا تستدعي شاشة البوصلة ولا التحقق الفلكي. تختبر محرك WMM2025 المستقل فقط.</p><div id="summary" class="box"></div><table><thead><tr><th>الموقع/السنة</th><th>NOAA D°</th><th>المحرك D°</th><th>الخطأ</th><th>النتيجة</th></tr></thead><tbody id="rows"></tbody></table><div class="box"><h2>اختبار يدوي</h2><input id="lat" type="number" step="any" placeholder="Latitude"><input id="lon" type="number" step="any" placeholder="Longitude"><input id="yr" type="number" step="any" value="2026.5"><button onclick="calc()">احسب</button><p id="out"></p></div></main><script src="js/geomag/wmm2025.js"></script><script>const tests=QiblaWMM2025.selfTest();rows.innerHTML=tests.map(t=>`<tr><td>${t.lat}, ${t.lon} / ${t.year}</td><td>${t.expected.toFixed(2)}</td><td>${t.actual.toFixed(4)}</td><td>${t.error.toFixed(4)}°</td><td class="${t.pass?'ok':'bad'}">${t.pass?'PASS':'FAIL'}</td></tr>`).join('');const pass=tests.every(x=>x.pass);summary.className='box '+(pass?'ok':'bad');summary.textContent=pass?'PASS — جميع قيم NOAA المرجعية الست ضمن ±0.02°':'FAIL — لا يتم السماح بالربط Runtime';function calc(){try{const r=QiblaWMM2025.field(+lat.value,+lon.value,{decimalYear:+yr.value});out.textContent=`D=${r.declinationDeg.toFixed(4)}° | I=${r.inclinationDeg.toFixed(4)}° | H=${r.horizontalNt.toFixed(1)} nT`; }catch(e){out.textContent=e.message}}</script></html>
