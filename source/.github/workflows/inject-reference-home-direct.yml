name: Inject Reference Home Directly

on:
  push:
    paths:
      - '.github/workflows/inject-reference-home-direct.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/astronomical-solver-foundation
          fetch-depth: 0

      - name: Inject direct assets into index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css_marker = '<!-- QIBLAASTRO_REFERENCE_HOME_DIRECT_CSS -->'
          css_block = '''\n<!-- QIBLAASTRO_REFERENCE_HOME_DIRECT_CSS -->\n<link rel="stylesheet" href="css/46-reference-home-rebuild-stage4.css?v=20260806-2205">\n<link rel="stylesheet" href="css/47-reference-mobile-lock-stage5.css?v=20260806-2205">\n'''

          js_marker = '<!-- QIBLAASTRO_REFERENCE_HOME_DIRECT_JS -->'
          js_block = '''\n<!-- QIBLAASTRO_REFERENCE_HOME_DIRECT_JS -->\n<script src="js/101-reference-home-rebuild-stage4.js?v=20260806-2205"></script>\n'''

          if css_marker not in text:
              if '</head>' not in text:
                  raise SystemExit('Missing </head> in index.html')
              text = text.replace('</head>', css_block + '\n</head>', 1)

          if js_marker not in text:
              if '</body>' not in text:
                  raise SystemExit('Missing </body> in index.html')
              text = text.replace('</body>', js_block + '\n</body>', 1)

          path.write_text(text, encoding='utf-8')

      - name: Verify direct references
        run: |
          grep -n "QIBLAASTRO_REFERENCE_HOME_DIRECT" index.html
          grep -n "46-reference-home-rebuild-stage4.css" index.html
          grep -n "47-reference-mobile-lock-stage5.css" index.html
          grep -n "101-reference-home-rebuild-stage4.js" index.html

      - name: Commit direct HTML integration
        run: |
          git config user.name "QiblaAstro Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix(home): load approved reference interface directly from index"
          git push origin HEAD:feature/astronomical-solver-foundation
