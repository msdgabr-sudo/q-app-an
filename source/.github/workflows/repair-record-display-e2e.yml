name: Repair Astronomical Record Display E2E

on:
  push:
    branches:
      - feature/astronomical-solver-foundation
    paths:
      - 'scripts/fix-record-display-e2e.js'
      - 'tests/record-display-e2e.test.js'
      - '.github/workflows/repair-record-display-e2e.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: record-display-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/astronomical-solver-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply end-to-end repair
        run: node scripts/fix-record-display-e2e.js
      - name: Verify record reaches DOM
        run: node tests/record-display-e2e.test.js
      - name: Run core astronomical regressions
        run: |
          node tests/astronomical-verification-session.test.js
          node tests/compass-cards-canonical.test.js
          node tests/qibla-card-runtime.test.js
          node tests/field-test-readiness.test.js
      - name: Check syntax
        run: |
          node --check js/astronomical-verification-session.js
          node --check js/astronomical-verification-store.js
          node --check js/qibla-card-runtime.js
      - name: Commit verified repair
        run: |
          rm -f scripts/fix-record-display-e2e.js
          git config user.name 'QiblaAstro Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: persist and display astronomical reading end to end'
          git push origin HEAD:feature/astronomical-solver-foundation
