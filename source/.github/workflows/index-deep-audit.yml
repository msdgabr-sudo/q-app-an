name: Deep index audit (report only)

on:
  workflow_dispatch:
  push:
    branches: [new]
    paths:
      - 'scripts/audit-index-deep.js'
      - '.github/workflows/index-deep-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify protected core first
        run: node scripts/check-protected-core.js
      - name: Generate static report only
        run: node scripts/audit-index-deep.js
      - name: Confirm application files are untouched
        run: |
          git diff --exit-code -- index.html js css service-worker.js manifest.json || true
          if ! git diff --quiet -- index.html; then echo 'index changed unexpectedly'; exit 1; fi
      - name: Commit reports only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/index-deep-audit.json reports/index-deep-audit.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: deep static index report [skip ci]'
          git push origin HEAD:new
