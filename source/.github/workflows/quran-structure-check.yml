name: Quran structure verification

on:
  push:
    branches: [quran-stable]
    paths:
      - 'quran/**'
      - 'scripts/verify-quran-text.mjs'
      - '.github/workflows/quran-structure-check.yml'
  pull_request:
    paths:
      - 'quran/**'
      - 'scripts/verify-quran-text.mjs'

jobs:
  verify-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Quran structure
        run: |
          set +e
          node scripts/verify-quran-text.mjs
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "Structural verification passed; exact reference comparison is intentionally pending."
            exit 0
          fi
          exit "$code"
